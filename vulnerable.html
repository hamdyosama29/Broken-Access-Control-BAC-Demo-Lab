<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCorp - Admin Dashboard (Vulnerable)</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .observation-grid {
            grid-template-columns: repeat(4, 1fr);
        }
        @media (max-width: 768px) {
            .observation-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">SecureCorp</a>
        <div class="user-info">
            <span>Logged in as: Normal User</span>
            <span class="badge">Role: USER</span>
        </div>
    </header>

    <main>
        

        <!-- Error 403 State -->
        <div id="accessDeniedAlert" class="error-403-container">
            <div class="error-code">403</div>
            <div class="error-title">Forbidden</div>
            <div class="error-desc">Your account does not have permission to access this resource.</div>
        </div>

        <!-- Data Table (Hidden by default, shown briefly, then hidden again) -->
        <div id="dataTableContainer" class="table-container" style="display: none;">
            <div style="padding: 1rem; border-bottom: 1px solid var(--border-color);">
                <h3 style="margin: 0; font-size: 1rem;">Admin Users</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Department</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>


    </main>

    <script src="/js/vulnerable.js"></script>
</body>
</html>
